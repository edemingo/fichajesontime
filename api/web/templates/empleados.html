<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>API Web - Consulta Accesos Tornos MARCONI 1</title>
  <link rel="stylesheet" href="/static/main.css">
</head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<script>const empleadosSelected = 'selected'</script>

<body >


    <div id="liveAlertPlaceholder"></div>

  

  <!-- Main Content with offset for sidebar 
  <div class="main-content" style="margin-left: 4.5em;">
  -->

<div class="container-fluid">
    <h1 class="text-center">Consulta Empleados MARCONI 1</h1>
    <!-- start row principal -->
    <div class="row ">
         <div class="row ">

            <div class="col-1 border-1">
            <!-- MENU VERTICAL -->
             
                 <!-- Vertical Menu Sidebar -->
                <div class="d-flex flex-column flex-shrink-0 border  sidebar" style="width: 4.0em;" id="mainMenu">

                
                </div>
                <!-- END:  Vertical Menu Sidebar -->

            </div>
            <!-- END : MENU VERTICAL -->
        

        <!-- col 9 principal LISTADO-->
        <div class="col-9 border">

            <form  id="filter-form" name="filter-form">

                <!-- Filtros -->
                <div class="row ">
                    <div class="col-md-1 p-3">
                        <label for="statusFilter" class="form-label">Estado</label>
                        <select class="form-select" id="status" name="status">
                            <option value="">Todos</option>
                            <option value="active">Activo</option>
                            <option value="unactive">Inactivo</option>
                        </select>
                    </div>
                    

                  <div class="col-md-2 p-3">
                        <label for="identifier" class="form-label">DNI</label>
                        <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Buscar por DNI">
                    </div>

                    <div class="col-md-2 p-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Buscar por nombre">
                    </div>
                    <div class="col-md-2 p-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" class="form-control" id="email" name="email" placeholder="Buscar por email">
                    </div>

                    <div class="col-md-2 p-3">
                        <label for="numEmpleadoFilter" class="form-label">Nº Empl.</label>
                        <input type="text" class="form-control" id="id" name="id"  placeholder="Buscar por N empleado">
                    </div>

                    <div class="col-md-3 p-3 pt-5">
                        <input type="hidden" id="offset" name="offset" value="0"/>
                        <input type="hidden" id="step" name="step" value="10"/>

                        <button class="btn btn-primary " type="submit" id="filterBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg> Filtrar</button>

                        <button class="btn btn-danger " type="reset" id="filterRst">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                            </svg> Limpar</button>
                        
                    
                        <button class="btn btn-success ms-2" type="button" id="updateUsersBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                              <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                              <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                            </svg> Usuarios</button>
                    </div>
                </div>

            </form>

                <!-- Tabla de Empleados -->
                <div class="table-responsive">
                    <table class="table table-striped" id="empleadosTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Fecha Terminación</th>
                                <th>Mas info</th>
                            </tr>
                        </thead>
                        <tbody id="empleadosTableBody">
                            <!-- Datos  -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginador -->
                <nav aria-label="Paginador de empleados">
                    <ul class="pagination justify-content-center">
                        <li class="page-item "><!-- disabled -->
                            <button class="btn btn-primary page-link" id="prevPageBtn">Anterior</button>
                        </li>
                        <li>&nbsp;</li>
                        <!-- 
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        -->
                        <li class="page-item">
                            <button class="btn btn-primary page-link" id="nextPageBtn">Siguiente</button>
                        </li>
                        
                    </ul>
                </nav>

                <div class="row align-items-start" id="results"></div>
                <div class="row align-items-start" id="resultsFiles"></div>

        </div>
        <!-- END : col 9 principal LISTADO-->

    </div>

</div>
<!-- end  row principal -->




  <div class="modal fade" tabindex="-1" id="EmpleadosModalContent" aria-labelledby="EmpleadosModalContent" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Contenido de Factorial</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">        
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>        
      </div>
    </div>
  </div>
</div>

  <script src="/static/navigation.js"></script>
  <script src="/static/empleados.js"></script>
  <script src="/static/alerts.js"></script>
  
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
